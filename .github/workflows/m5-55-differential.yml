name: M5.55 Differential Smoke

on:
  push:
    branches: [main]
    paths:
      - 'emulator/**'
      - 'tools/processor_tests_feed.py'
      - 'tools/fetch-processor-tests.sh'
      - '.github/workflows/m5-55-differential.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  processor-tests-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build differential runner
        working-directory: emulator
        run: make build/test_differential
      - name: Fetch pinned NOP ProcessorTests vectors
        run: |
          mkdir -p .cache/ProcessorTests/65816/v1
          base=https://raw.githubusercontent.com/SingleStepTests/ProcessorTests/bb11756436da8fd16cce86aef63dc6725f48836f/65816/v1
          curl --fail --silent --show-error --location "$base/ea.e.json" -o .cache/ProcessorTests/65816/v1/ea.e.json
          curl --fail --silent --show-error --location "$base/ea.n.json" -o .cache/ProcessorTests/65816/v1/ea.n.json
      - name: Run pinned NOP semantic smoke
        run: |
          python3 tools/processor_tests_feed.py .cache/ProcessorTests/65816/v1/ea.e.json --limit 10 --runner emulator/build/test_differential --run
          python3 tools/processor_tests_feed.py .cache/ProcessorTests/65816/v1/ea.n.json --limit 10 --runner emulator/build/test_differential --run
