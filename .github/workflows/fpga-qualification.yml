name: FPGA Qualification Manifest
on:
  pull_request:
    paths:
      - 'hardware/fpga/qualification/**'
      - '.github/workflows/fpga-qualification.yml'
  push:
    branches: [main]
    paths:
      - 'hardware/fpga/qualification/**'
      - '.github/workflows/fpga-qualification.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Unit tests
        run: python3 -m unittest discover -s hardware/fpga/qualification -p 'test_*.py' -v
      - name: Validate candidate manifests (PENDING is allowed)
        run: python3 hardware/fpga/qualification/validate.py
